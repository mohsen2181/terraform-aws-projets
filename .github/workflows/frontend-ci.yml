name: "Frontend CI/CD"

on:
  push:
    branches: [ "main" ]
    paths:
      - "terraform-ecommerce/frontend/**"
      - "terraform-ecommerce/data/product-images/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ROLE_TO_ASSUME: arn:aws:iam::727742746869:role/github-actions-ecommerce-role

jobs:
  deploy-frontend:
    name: "Build & Deploy React SPA"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: "terraform-ecommerce/frontend/react-app/package-lock.json"

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Dynamically Configure aws-config.js
        run: |
          chmod +x terraform-ecommerce/scripts/configure-frontend.sh
          terraform-ecommerce/scripts/configure-frontend.sh

      - name: Install Frontend Dependencies
        working-directory: terraform-ecommerce/frontend/react-app
        run: npm ci

      - name: Build React SPA
        working-directory: terraform-ecommerce/frontend/react-app
        env:
          CI: false
        run: npm run build

      - name: Sync Production Bundle and Images to S3 & Invalidate CloudFront
        run: |
          ACCOUNT_ID="727742746869"
          BUCKET_NAME="ecommerce-frontend-${ACCOUNT_ID}"
          
          echo "Checking if S3 frontend bucket exists..."
          if aws s3 ls "s3://${BUCKET_NAME}" > /dev/null 2>&1; then
            echo "Syncing React build to s3://${BUCKET_NAME}..."
            aws s3 sync terraform-ecommerce/frontend/react-app/build/ "s3://${BUCKET_NAME}/"
            
            echo "Ensuring product images are synced to S3..."
            cd terraform-ecommerce/data
            if [ ! -d "product-images" ] || [ $(ls product-images 2>/dev/null | wc -l) -lt 100 ]; then
              echo "Downloading 100 sample product images..."
              chmod +x download-product-images.sh
              ./download-product-images.sh
            fi
            aws s3 sync product-images/ "s3://${BUCKET_NAME}/images/products/" --content-type "image/jpeg"
            cd "$GITHUB_WORKSPACE" 
            
            echo "Finding CloudFront distribution for ${BUCKET_NAME}..."
            DIST_ID=$(aws cloudfront list-distributions \
              --query "DistributionList.Items[?Origins.Items[?contains(DomainName, '${BUCKET_NAME}')]].Id | [0]" \
              --output text)
            
            if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
              echo "Creating CloudFront invalidation for distribution ${DIST_ID}..."
              aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
              echo "CloudFront cache invalidation submitted successfully!"
            else
              echo "No CloudFront distribution found for bucket, skipping invalidation."
            fi
          else
            echo "Bucket s3://${BUCKET_NAME} does not exist yet. Run terraform apply first."
          fi
