name: "Terraform Destroy (Gated Teardown)"

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type 'destroy-ecommerce-production' to confirm teardown:"
        required: true
        default: ""

permissions:
  id-token: write
  contents: read

# Serializes with terraform-apply to prevent state lock race conditions
concurrency:
  group: terraform-production-apply
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ROLE_TO_ASSUME: arn:aws:iam::727742746869:role/github-actions-ecommerce-role

jobs:
  destroy:
    name: "Destroy AWS Infrastructure"
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform-ecommerce/environments/dev

    steps:
      - name: Verify Confirmation Passphrase
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "destroy-ecommerce-production" ]; then
            echo "❌ ERROR: Aborting destruction."
            echo "Confirmation phrase entered: '${{ github.event.inputs.confirmation }}'"
            echo "Expected: 'destroy-ecommerce-production'"
            exit 1
          fi
          echo "✅ Confirmation passphrase verified. Proceeding with teardown..."

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Prepare Lambda zip for hash check
        run: |
          mkdir -p ../../backend/order-processor
          touch ../../backend/order-processor/handler.py
          cd ../../backend/order-processor && zip -q order_processor.zip handler.py

      - name: Empty Frontend S3 Bucket (Pre-requisite for bucket deletion)
        run: |
          ACCOUNT_ID="727742746869"
          BUCKET_NAME="ecommerce-frontend-${ACCOUNT_ID}"
          echo "Checking if bucket s3://${BUCKET_NAME} exists..."
          if aws s3 ls "s3://${BUCKET_NAME}" > /dev/null 2>&1; then
            echo "Emptying all objects and versions from s3://${BUCKET_NAME}..."
            aws s3 rm "s3://${BUCKET_NAME}" --recursive || true
            echo "Bucket emptied successfully."
          fi

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD || 'PlaceholderPlanPass123!' }}
        run: terraform destroy -auto-approve

      - name: Teardown Summary
        run: |
          echo "=========================================================="
          echo "✅ All AWS application infrastructure destroyed successfully!"
          echo "Remote state updated in: s3://ecommerce-tfstate-727742746869"
          echo "=========================================================="
