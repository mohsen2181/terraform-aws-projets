name: "Terraform Apply (Production Deploy)"

on:
  push:
    branches: [ "main" ]
    paths:
      - "terraform-ecommerce/environments/**"
      - "terraform-ecommerce/modules/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Prevents state lock race conditions by queuing runs
concurrency:
  group: terraform-production-apply
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ROLE_TO_ASSUME: arn:aws:iam::727742746869:role/github-actions-ecommerce-role

jobs:
  apply:
    name: "Apply Infrastructure to AWS"
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform-ecommerce/environments/dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Setup Node.js (for frontend deployment)
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Prepare Lambda zip for hash check
        run: |
          mkdir -p ../../backend/order-processor
          touch ../../backend/order-processor/handler.py
          cd ../../backend/order-processor && zip -q order_processor.zip handler.py

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD || 'PlaceholderPlanPass123!' }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Seed DynamoDB Product Catalog (if empty)
        run: |
          cd "$GITHUB_WORKSPACE/terraform-ecommerce/data"
          COUNT=$(aws dynamodb scan --table-name ecommerce-products --region ${{ env.AWS_REGION }} --select "COUNT" --query "Count" --output text 2>/dev/null || echo "0")
          echo "Current product count in DynamoDB: ${COUNT}"
          if [ "${COUNT}" -eq 0 ]; then
            echo "Seeding DynamoDB products table..."
            chmod +x load-products.sh
            ./load-products.sh ${{ env.AWS_REGION }}
          else
            echo "DynamoDB table already contains ${COUNT} products. Skipping seeding."
          fi

      - name: Sync Product Images to S3
        run: |
          ACCOUNT_ID="727742746869"
          BUCKET_NAME="ecommerce-frontend-${ACCOUNT_ID}"
          cd "$GITHUB_WORKSPACE/terraform-ecommerce/data"
          if [ -d "product-images" ]; then
            echo "Syncing product images to s3://${BUCKET_NAME}/images/products/..."
            aws s3 sync product-images/ "s3://${BUCKET_NAME}/images/products/" --region ${{ env.AWS_REGION }} --content-type "image/jpeg"
          fi

      - name: Configure and Deploy Frontend SPA
        run: |
          chmod +x "$GITHUB_WORKSPACE/terraform-ecommerce/scripts/configure-frontend.sh"
          "$GITHUB_WORKSPACE/terraform-ecommerce/scripts/configure-frontend.sh"
          
          cd "$GITHUB_WORKSPACE/terraform-ecommerce/frontend/react-app"
          npm ci
          npm run build
          
          ACCOUNT_ID="727742746869"
          BUCKET_NAME="ecommerce-frontend-${ACCOUNT_ID}"
          echo "Syncing React build to s3://${BUCKET_NAME}..."
          aws s3 sync build/ "s3://${BUCKET_NAME}/"
          
          echo "Finding CloudFront distribution for ${BUCKET_NAME}..."
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Origins.Items[?contains(DomainName, '${BUCKET_NAME}')]].Id | [0]" \
            --output text)
          
          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
            echo "Creating CloudFront invalidation for distribution ${DIST_ID}..."
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
            echo "CloudFront invalidation submitted successfully!"
          fi
